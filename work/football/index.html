<!doctype html>
<html>

<head>
  <meta charset=utf-8>
  <meta name=viewport content="width=device-width,initial-scale=1">
</head>

<body>
  <title>تسعون دقيقة من التخصصات</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Oswald:wght@400;500;600&display=swap">
  <style>
    :root {
      --ground: #0C2A25;
      --panel: #123833;
      --chalk: #EEF2E8;
      --dim: #B7C6BC;
      --line: rgba(238, 242, 232, .16);
      --coral: #EE6A55;
      --amber: #F2B84B;
      --sky: #6DB8DE;
      --mint: #86D8A6;
      --display: 'Lalezar', 'Reem Kufi', 'Segoe UI Black', 'Segoe UI', 'Geeza Pro', 'Al Nile', Tahoma, sans-serif;
      --body: 'IBM Plex Sans Arabic', 'Segoe UI', 'Geeza Pro', 'SF Arabic', Tahoma, sans-serif;
      --num: 'Oswald', 'Bahnschrift', 'Arial Narrow', 'Helvetica Neue Condensed', Impact, sans-serif;
      color-scheme: dark;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--ground);
    }

    body {
      overflow: hidden;
      font-family: var(--body);
      color: var(--chalk);
      -webkit-font-smoothing: antialiased;
    }

    * {
      box-sizing: border-box;
    }

    #viewport {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--ground);
    }

    #stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: 0 0;
      background: radial-gradient(ellipse at 20% 0%, #16463E 0%, var(--ground) 62%);
      overflow: hidden;
    }

    #pitch {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      transition: transform 1.4s cubic-bezier(.6, .05, .2, 1);
      transform-origin: 960px 540px;
      pointer-events: none;
    }

    .slide {
      position: absolute;
      inset: 0;
      padding: 110px 128px 130px;
      opacity: 0;
      visibility: hidden;
      transform: translateX(var(--ox, 0px));
      transition: opacity .5s ease, transform .8s cubic-bezier(.2, .8, .2, 1), visibility 0s linear .8s;
    }

    .slide.on {
      opacity: 1;
      visibility: visible;
      transition: opacity .5s ease, transform .8s cubic-bezier(.2, .8, .2, 1);
    }

    .slide.on .in {
      animation: rise .75s cubic-bezier(.2, .7, .2, 1) both;
      animation-delay: calc(var(--i, 0)*90ms);
    }

    @keyframes rise {
      from {
        opacity: .55;
        transform: translateY(26px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* clock + touchline */
    #clock {
      position: absolute;
      left: 128px;
      top: 52px;
      display: flex;
      align-items: baseline;
      gap: 14px;
      direction: ltr;
      font-family: var(--num);
      color: var(--chalk);
    }

    #clock b {
      font-size: 64px;
      font-weight: 500;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    #clock span {
      font-size: 28px;
      color: var(--dim);
      font-family: var(--body);
      direction: rtl;
      transition: color .3s;
    }

    #clock span.hot {
      color: var(--amber);
      font-weight: 700;
    }

    #tmr {
      position: absolute;
      right: 128px;
      top: 44px;
      display: none;
      align-items: center;
      gap: 14px;
      direction: ltr;
      font-family: var(--num);
      font-size: 56px;
      color: var(--chalk);
      padding: 4px 26px 8px;
      border-radius: 999px;
      border: 2px solid var(--line);
      background: rgba(18, 56, 51, .7);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    #tmr.show {
      display: flex;
    }

    #tmr small {
      font-family: var(--body);
      font-size: 24px;
      color: var(--dim);
      direction: rtl;
    }

    #tmr.warn {
      color: var(--amber);
      border-color: var(--amber);
    }

    #tmr.crit {
      color: var(--coral);
      border-color: var(--coral);
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      50% {
        opacity: .55;
      }
    }

    .card {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 22px;
      opacity: 0;
    }

    .card i {
      display: block;
      width: 78px;
      height: 112px;
      border-radius: 12px;
      background: var(--cc);
      box-shadow: 0 10px 24px rgba(0, 0, 0, .4);
    }

    .card b {
      font-size: 34px;
      font-weight: 700;
      color: var(--chalk);
    }

    .slide.on .card {
      animation: cardin .7s cubic-bezier(.2, 1.3, .4, 1) both;
      animation-delay: var(--cd, 2s);
    }

    @keyframes cardin {
      from {
        opacity: 0;
        transform: translateY(-140px) rotate(-28deg);
      }

      to {
        opacity: 1;
        transform: translateY(0) rotate(-6deg);
      }
    }

    #touch {
      position: absolute;
      left: 128px;
      right: 128px;
      bottom: 64px;
      height: 4px;
      background: var(--line);
      border-radius: 2px;
    }

    #touch i {
      position: absolute;
      right: 0;
      top: 0;
      height: 4px;
      width: 0;
      background: var(--amber);
      border-radius: 2px;
      transition: width .6s ease;
    }

    #touch em {
      position: absolute;
      top: -11px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--chalk);
      border: 4px solid var(--ground);
      margin-right: -13px;
      transition: right .6s ease;
    }

    /* type */
    h1,
    h2,
    h3,
    p,
    ul {
      margin: 0;
      padding: 0;
    }

    .disp {
      font-family: var(--display);
      font-weight: 400;
      text-wrap: balance;
    }

    .dim {
      color: var(--dim);
    }

    /* cover */
    .cover {
      text-align: center;
    }

    .cover h1 {
      font-size: 150px;
      line-height: 1.05;
      margin-top: 20px;
    }

    .cover .sub {
      font-size: 48px;
      font-weight: 500;
      color: var(--dim);
      margin-top: 18px;
    }

    .cover .by {
      display: inline-block;
      margin-top: 30px;
      font-size: 40px;
      font-weight: 600;
      color: var(--amber);
      padding: 10px 34px;
      border: 2px dashed rgba(242, 184, 75, .55);
      border-radius: 999px;
    }

    .cover .ball {
      position: absolute;
      left: 0;
      right: 0;
      top: 520px;
      display: flex;
      justify-content: center;
    }

    /* count */
    .count {
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      gap: 80px;
      align-items: center;
      height: 100%;
    }

    .count h2 {
      font-size: 104px;
      line-height: 1.1;
    }

    .big {
      display: flex;
      align-items: baseline;
      gap: 22px;
      margin-top: 34px;
      direction: ltr;
      justify-content: flex-end;
    }

    .big b {
      font-family: var(--num);
      font-weight: 500;
      font-size: 300px;
      line-height: .9;
      color: var(--amber);
      font-variant-numeric: tabular-nums;
    }

    .big span {
      font-size: 44px;
      font-weight: 600;
      direction: rtl;
      white-space: nowrap;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      padding: 14px 30px 14px 26px;
      border: 2px solid var(--line);
      border-radius: 999px;
      font-size: 42px;
      font-weight: 500;
      background: rgba(18, 56, 51, .7);
      color: var(--chalk);
      font-family: var(--body);
    }

    .chip .e {
      display: inline-flex;
      line-height: 1;
    }

    /* discipline */
    .disc {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 100px;
      height: 100%;
      align-items: center;
    }

    .head {
      display: flex;
      align-items: center;
      gap: 40px;
    }

    .token {
      position: relative;
      flex: none;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--panel);
      font-size: 112px;
      line-height: 1;
    }

    .token:before {
      content: "";
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      border: 4px dashed var(--acc);
      opacity: .9;
      animation: spin 40s linear infinite;
    }

    .disc h2 {
      font-size: 112px;
      line-height: 1.02;
      color: var(--chalk);
    }

    .tagline {
      font-size: 54px;
      font-weight: 600;
      line-height: 1.3;
      margin-top: 44px;
      color: var(--acc);
      text-wrap: balance;
    }

    .badges {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 28px;
    }

    .badge {
      font-family: var(--num);
      font-weight: 500;
      font-size: 40px;
      letter-spacing: .06em;
      padding: 6px 26px;
      border-radius: 12px;
      border: 3px solid var(--acc);
      color: var(--chalk);
    }

    .slide.on .badge {
      animation: sweep 1s ease both;
      animation-delay: calc(1.3s + var(--k, 0)*.75s);
    }

    @keyframes sweep {
      0% {
        background: transparent;
        color: var(--chalk);
        transform: none;
      }

      22%,
      62% {
        background: var(--acc);
        color: #0C2A25;
        transform: scale(1.08);
      }

      100% {
        background: transparent;
        color: var(--chalk);
        transform: none;
      }
    }

    .badge.ar {
      font-family: var(--body);
      letter-spacing: 0;
      font-size: 36px;
      font-weight: 600;
    }

    .note {
      margin-top: 44px;
      padding-top: 26px;
      border-top: 2px dashed var(--line);
      font-size: 34px;
      line-height: 1.55;
      color: var(--dim);
      max-width: 760px;
    }

    .note small {
      display: block;
      font-family: var(--body);
      font-size: 28px;
      font-weight: 700;
      color: var(--acc);
      margin-bottom: 8px;
      direction: rtl;
      text-align: right;
    }

    .items {
      list-style: none;
      display: flex;
      flex-direction: column;
    }

    .items li {
      display: flex;
      align-items: center;
      gap: 26px;
      font-size: 50px;
      font-weight: 500;
      padding: 17px 0;
      border-bottom: 2px dashed var(--line);
    }

    .items li:last-child {
      border-bottom: none;
    }

    .items li:before {
      content: "";
      flex: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--acc);
    }

    .items li .e {
      display: inline-flex;
      flex: none;
    }

    .items li.has-e:before {
      display: none;
    }

    /* journey */
    .jhead h2 {
      font-size: 132px;
      line-height: 1.05;
    }

    .jhead p {
      font-size: 46px;
      color: var(--dim);
      margin-top: 14px;
      font-weight: 500;
    }

    .jn {
      position: absolute;
      width: 250px;
      text-align: center;
    }

    .jd {
      position: absolute;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: var(--num);
      font-size: 30px;
      font-weight: 500;
      color: #0C2A25;
      border: 5px solid var(--ground);
    }

    .jn h3 {
      font-size: 36px;
      font-weight: 700;
    }

    .jn p {
      font-size: 28px;
      line-height: 1.4;
      color: var(--dim);
      margin-top: 6px;
    }

    /* orbit */
    .orb {
      position: absolute;
      width: 190px;
      text-align: center;
      transform: translate(-50%, -50%);
    }

    .orb .oi {
      display: block;
    }

    .orb .t {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      margin: 0 auto 8px;
      display: grid;
      place-items: center;
      background: var(--panel);
      border: 3px solid var(--c);
    }

    .orb span {
      font-size: 30px;
      font-weight: 600;
      line-height: 1.2;
      display: block;
    }

    .orb .oi {
      position: relative;
    }

    .orb.sl span {
      position: absolute;
      top: 50%;
      transform: translateY(-58%);
      white-space: nowrap;
    }

    .orb.sl.L span {
      right: calc(50% + 66px);
    }

    .orb.sl.R span {
      left: calc(50% + 66px);
    }

    .orb.sl .t {
      margin: 0 auto;
    }

    .cap {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
    }

    /* closing */
    .close {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 80px;
      align-items: center;
      height: 100%;
    }

    .close h2 {
      font-size: 104px;
      line-height: 1.12;
    }

    .close .l2 {
      font-size: 56px;
      font-weight: 600;
      line-height: 1.35;
      margin-top: 34px;
      color: var(--amber);
      text-wrap: balance;
    }

    .close .l3 {
      font-size: 40px;
      line-height: 1.5;
      margin-top: 34px;
      color: var(--dim);
    }

    .thx {
      font-size: 88px;
      line-height: 1.1;
      margin-top: 40px;
      color: var(--chalk);
    }

    .pick {
      font-size: 34px;
      font-weight: 600;
      margin-bottom: 22px;
      color: var(--dim);
    }

    .pick b {
      color: var(--amber);
    }

    button.chip {
      cursor: pointer;
    }

    button.chip:hover {
      border-color: var(--amber);
    }

    button.chip.sel {
      background: var(--amber);
      color: #0C2A25;
      border-color: var(--amber);
    }

    button.chip.sel .ic path {
      stroke: #0C2A25 !important;
    }

    button:focus-visible {
      outline: 4px solid var(--amber);
      outline-offset: 4px;
    }

    /* poll */
    .poll {
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
    }

    .poll h2 {
      font-size: 104px;
      line-height: 1.12;
      max-width: 1400px;
    }

    .poll .sub {
      font-size: 46px;
      color: var(--dim);
      margin-top: 16px;
      font-weight: 500;
    }

    .popts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 28px;
      margin-top: 70px;
    }

    .pbtn {
      font-family: var(--display);
      font-size: 56px;
      padding: 46px 16px 52px;
      border-radius: 28px;
      border: 3px solid var(--line);
      background: rgba(18, 56, 51, .7);
      color: var(--chalk);
      cursor: pointer;
      transition: background .2s, color .2s, transform .2s;
    }

    .pbtn:hover {
      border-color: var(--amber);
    }

    .pbtn.sel {
      background: var(--amber);
      color: #0C2A25;
      border-color: var(--amber);
      transform: translateY(-6px);
    }

    .pmsg {
      font-size: 46px;
      font-weight: 600;
      color: var(--amber);
      margin-top: 40px;
      min-height: 64px;
    }

    .glin {
      font-size: 42px;
      font-weight: 600;
      color: var(--mint);
      margin-top: 26px;
      min-height: 60px;
      text-align: right;
    }

    /* numbers */
    .numbers {
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: center;
    }

    .numbers h2 {
      font-size: 104px;
      line-height: 1.1;
    }

    .numbers .sub {
      font-size: 44px;
      color: var(--dim);
      margin-top: 12px;
      font-weight: 500;
    }

    .ngrid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 30px;
      margin-top: 60px;
    }

    .ntile {
      padding: 34px 30px 36px;
      border-radius: 24px;
      background: rgba(18, 56, 51, .75);
      border-top: 6px solid var(--acc);
    }

    .ntile b {
      display: block;
      font-family: var(--num);
      font-weight: 500;
      font-size: 190px;
      line-height: 1;
      color: var(--chalk);
      direction: ltr;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .ntile .lb {
      font-size: 38px;
      font-weight: 600;
      margin-top: 10px;
      line-height: 1.3;
    }

    .ntile .tg {
      font-size: 31px;
      line-height: 1.45;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 2px dashed var(--line);
      color: var(--acc);
    }

    /* lineup */
    .lineup {
      display: grid;
      grid-template-columns: 600px 1000px;
      justify-content: space-between;
      height: 100%;
      align-items: center;
    }

    .lineup h2 {
      font-size: 92px;
      line-height: 1.1;
    }

    .lineup .sub {
      font-size: 40px;
      color: var(--dim);
      margin-top: 10px;
      font-weight: 500;
    }

    .lc {
      margin-top: 44px;
      padding: 34px 34px 38px;
      border-radius: 24px;
      background: rgba(18, 56, 51, .8);
      border: 2px solid var(--line);
      min-height: 430px;
    }

    .lc .ico {
      display: flex;
      justify-content: flex-end;
    }

    .lc h3 {
      font-size: 74px;
      font-family: var(--display);
      font-weight: 400;
      margin-top: 18px;
      line-height: 1.1;
    }

    .lc .pt {
      font-size: 36px;
      font-weight: 700;
      color: var(--acc);
      margin-top: 8px;
    }

    .lc p {
      font-size: 38px;
      line-height: 1.5;
      color: var(--dim);
      margin-top: 16px;
    }

    .field {
      position: relative;
      width: 1000px;
      height: 700px;
      border-radius: 26px;
      background: #0F332E;
      border: 3px solid rgba(238, 242, 232, .18);
    }

    .field svg.fl {
      position: absolute;
      inset: 0;
    }

    .field {
      overflow: visible;
    }

    #lball {
      position: absolute;
      left: 0;
      top: 0;
      width: 52px;
      height: 52px;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
      filter: drop-shadow(0 6px 5px rgba(0, 0, 0, .4));
    }

    .pos {
      position: absolute;
      width: 112px;
      height: 112px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      background: var(--panel);
      border: 4px solid var(--acc);
      cursor: pointer;
      padding: 0;
      transition: transform .2s, background .2s;
      color: var(--chalk);
      font-family: var(--body);
    }

    .pos:hover {
      transform: translate(-50%, -50%) scale(1.08);
    }

    .pos.sel {
      background: var(--acc);
      transform: translate(-50%, -50%) scale(1.14);
    }

    .pos.sel .ic path {
      stroke: #0C2A25 !important;
    }

    .pos span {
      position: absolute;
      top: 114px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 26px;
      font-weight: 600;
      white-space: nowrap;
      color: var(--dim);
    }

    .pos.sel span {
      color: var(--chalk);
    }

    /* before / after */
    .fsub {
      font-size: 38px;
      color: var(--dim);
      margin-top: 18px;
      font-weight: 500;
    }

    .flist {
      display: flex;
      flex-direction: column;
      gap: 22px;
      margin-top: 40px;
      perspective: 1600px;
    }

    .frow {
      height: 128px;
      cursor: pointer;
      outline: none;
    }

    .frow:focus-visible {
      outline: 4px solid var(--amber);
      outline-offset: 6px;
      border-radius: 24px;
    }

    .fcard {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform .9s cubic-bezier(.5, -.25, .25, 1.25);
    }

    .frow.flipped .fcard {
      transform: rotateX(180deg);
    }

    .fface {
      position: absolute;
      inset: 0;
      border-radius: 24px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      align-items: center;
      padding: 0 44px;
      overflow: hidden;
    }

    .ff {
      background: #1A2624;
      color: #8E9C94;
      border: 2px solid rgba(238, 242, 232, .08);
    }

    .fb {
      background: linear-gradient(90deg, #1C5A4D, #12403A);
      color: var(--chalk);
      border: 2px solid var(--amber);
      transform: rotateX(180deg);
    }

    .ftx {
      display: flex;
      align-items: center;
      gap: 26px;
      font-size: 46px;
      font-weight: 600;
      flex: 1;
    }

    .ftx b {
      font-weight: 600;
    }

    .ftag {
      position: absolute;
      left: 36px;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--body);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0;
      padding: 6px 20px;
