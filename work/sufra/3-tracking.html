</style>

    </div>
    <div style="position: absolute; top: 236px; left: 196px; width: 48px; height: 48px; border-radius: 24px; background: #E8972B; border: 4px solid #FFFFFF; box-sizing: border-box; display: flex; align-items: center; justify-content: center">

        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1A17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>

    <div style="display: flex; justify-content: space-between; align-items: center">

        <span style="font-size: 14px; color: #5E5A52">الوصول المتوقع</span>
        <span style="font-size: 30px; font-weight: 700">١٢ دقيقة</span>
      </div>
      <span style="background: #0E4D3A; color: #FFFFFF; padding: 8px 14px; border-radius: 14px; font-size: 13px; font-weight: 600">في الطريق</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <div style="height: 6px; border-radius: 3px; background: #0E4D3A"></div>
      <div style="height: 6px; border-radius: 3px; background: #0E4D3A"></div>
      <div style="height: 6px; border-radius: 3px; background: #0E4D3A"></div>
      <div style="height: 6px; border-radius: 3px; background: #E3E0D8"></div>

      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 600">أحمد</span>
        <span style="font-size: 13px; color: #5E5A52">مندوب التوصيل · ★ ٤٫٩</span>
      </div>
      <button aria-label="مراسلة" style="width: 48px; height: 48px; border-radius: 24px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center">

      </button>
      <button aria-label="اتصال" style="width: 48px; height: 48px; border-radius: 24px; border: 0; background: #0E4D3A; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>

    <div style="display: flex; justify-content: space-between; font-size: 15px; border-top: 1px solid #E3E0D8; padding-top: 16px">

      <span style="font-weight: 700">٢٨ ₪</span>
    </div>
