<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>سُفرة — تفاصيل الطبق</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E4D3A}a:hover{color:#08362a}
</style>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F3EC; color: #1B1A17; font-family: 'Readex Pro', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="height: 400px; background: #EAD9BF; position: relative; display: flex; align-items: center; justify-content: center; border-radius: 0 0 40px 40px">
    <span style="font-size: 14px; color: #6B5B43">[صورة الطبق — للتصوير]</span>
    <div style="position: absolute; top: 56px; left: 24px; right: 24px; display: flex; justify-content: space-between">
      <a href="1-home.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1A17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>
      </a>
      <button aria-label="إضافة للمفضلة" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#B4442C" stroke="#B4442C" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path></svg>
      </button>
    </div>
  </div>

  <div style="padding: 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 28px; font-weight: 700">مقلوبة دجاج</h1>
        <span style="font-size: 14px; color: #5E5A52">مطبخ ستّي · ٢٠–٣٠ دقيقة</span>
      </div>
      <span style="font-size: 26px; font-weight: 700; color: #0E4D3A">٢٥ ₪</span>
    </div>

    <div style="display: flex; gap: 10px">
      <span style="background: #FFFFFF; border-radius: 12px; padding: 8px 12px; font-size: 13px">★ ٤٫٩ (٣٢٠)</span>
      <span style="background: #FFFFFF; border-radius: 12px; padding: 8px 12px; font-size: 13px">٦٥٠ سعرة</span>
      <span style="background: #FFFFFF; border-radius: 12px; padding: 8px 12px; font-size: 13px">يكفي شخصين</span>
    </div>

    <p style="margin: 0; font-size: 15px; line-height: 1.7; color: #3D3A34">رز متبّل مع دجاج وباذنجان وزهرة مقلية، مقلوب ساخن ومزيّن باللوز والصنوبر، ومعه لبن.</p>

    <h2 style="margin: 4px 0 0; font-size: 16px; font-weight: 600">إضافات</h2>
    <div style="display: flex; gap: 10px">
      <button style="flex: 1; height: 48px; border-radius: 14px; border: 2px solid #0E4D3A; background: #FFFFFF; font: inherit; font-size: 14px; color: #1B1A17">لبن +٣ ₪</button>
      <button style="flex: 1; height: 48px; border-radius: 14px; border: 2px solid transparent; background: #FFFFFF; font: inherit; font-size: 14px; color: #1B1A17">سلطة +٥ ₪</button>
    </div>
  </div>

  <div style="position: absolute; bottom: 24px; left: 24px; right: 24px; display: flex; gap: 12px; align-items: center">
    <div style="height: 60px; border-radius: 30px; background: #FFFFFF; display: flex; align-items: center; gap: 4px; padding: 0 8px">
      <button aria-label="زيادة" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #F6F3EC; font: inherit; font-size: 20px; color: #1B1A17">+</button>
      <span style="width: 28px; text-align: center; font-size: 17px; font-weight: 600">١</span>
      <button aria-label="إنقاص" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #F6F3EC; font: inherit; font-size: 20px; color: #1B1A17">−</button>
    </div>
    <a href="3-tracking.html" style="flex: 1; height: 60px; border-radius: 30px; background: #0E4D3A; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600">أضف للسلة · ٢٨ ₪</a>
  </div>
</div>
</body>
</html>
